<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative border -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#44403c" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Badge -->
  <g transform="translate(80, 90)">
    <rect width="360" height="42" rx="21" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.3"/>
    <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#fde68a" letter-spacing="2">
      🌿 ШКОЛА БАННОГО МАСТЕРСТВА
    </text>
  </g>

  <!-- Title -->
  <text x="80" y="220" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#f5f5f4">
    Пармастер Квест
  </text>
  <text x="80" y="295" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#fbbf24">
    Путь к Мастерству
  </text>

  <!-- Description -->
  <text x="80" y="375" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" fill="#d6d3d1">
    Интерактивная геймифицированная школа банного искусства
  </text>
  <text x="80" y="415" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#a8a29e">
    Техника парения · Ароматерапия · Традиции пара · Именной сертификат
  </text>

  <!-- Feature tags -->
  <g transform="translate(80, 485)">
    <g transform="translate(0, 0)">
      <rect width="190" height="48" rx="12" fill="#1c1917" stroke="#44403c"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fde68a">
        ⚡ 7 Уровней
      </text>
    </g>
    <g transform="translate(210, 0)">
      <rect width="210" height="48" rx="12" fill="#1c1917" stroke="#44403c"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fde68a">
        🍃 8 Видов веников
      </text>
    </g>
    <g transform="translate(440, 0)">
      <rect width="210" height="48" rx="12" fill="#1c1917" stroke="#44403c"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fde68a">
        🌸 8 Целебных трав
      </text>
    </g>
    <g transform="translate(670, 0)">
      <rect width="240" height="48" rx="12" fill="#1c1917" stroke="#44403c"/>
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fde68a">
        👑 Сертификат пармейстера
      </text>
    </g>
  </g>

  <!-- Domain -->
  <text x="1120" y="580" text-anchor="end" font-family="monospace" font-size="20" font-weight="600" fill="#f59e0b">
    banya-school.ru
  </text>
</svg>